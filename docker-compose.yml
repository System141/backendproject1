services:
  bidmont-db:
    image: postgres:16-alpine
    container_name: bidmont-db
    environment:
      POSTGRES_USER: bidmont
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bidmont
    volumes:
      - bidmont-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidmont"]
      interval: 5s
      timeout: 3s
      retries: 5

  bidmont-app:
    build: .
    container_name: bidmont-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+asyncpg://bidmont:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@bidmont-db:5432/bidmont
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      - FRONTEND_URL=${FRONTEND_URL:?Set FRONTEND_URL in .env}
      - MONRI_ENV=${MONRI_ENV:-test}
      - MONRI_MERCHANT_KEY=${MONRI_MERCHANT_KEY:-}
      - MONRI_AUTHENTICITY_TOKEN=${MONRI_AUTHENTICITY_TOKEN:-}
      - PAYMENTS_SIMULATE=${PAYMENTS_SIMULATE:-}
      - SEED_SECRET=${SEED_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@bidmont.com}
      - HTTP_COMPRESSION=${HTTP_COMPRESSION:-true}
    depends_on:
      bidmont-db:
        condition: service_healthy
    volumes:
      - bidmont-uploads:/app/backend/uploads
      - bidmont-private-uploads:/app/backend/private_uploads
    restart: unless-stopped
    networks:
      - default
      - montherapy_net

volumes:
  bidmont-pgdata:
  bidmont-uploads:
  bidmont-private-uploads:

networks:
  default: {}
  montherapy_net:
    external: true

version: '3.8'

services:
  bidmont-app:
    build: .
    container_name: bidmont-app
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=bidmont-dev-secret-change-in-production
      - ENVIRONMENT=development
    volumes:
      - bidmont-data:/app/backend
    restart: unless-stopped

volumes:
  bidmont-data:
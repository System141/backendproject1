# Render Blueprint — one-click deploy configuration
# https://render.com/docs/blueprint-spec

services:
  # Web Service: FastAPI backend
  - type: web
    name: bidmont-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bidmont-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://bidmont.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: bidmont-db
    plan: free
    databaseName: bidmont
    ipAllowList: [] # allow only internal connections